[project]
name = "vcf-migrator"
version = "0.2.0"
description = "Legacy DR (Zerto, RecoverPoint for VMs) to VCF Protection & Recovery migration engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "certifi==2024.7.4",
    "charset-normalizer==3.1.0",
    "idna==3.15",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0.1",
    "pyvmomi>=9.1.0.0",
    "requests==2.33.0",
    "rich>=15.0.0",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers>=4.8",
]

[project.scripts]
vcf-migrator = "src.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
markers = ["docker: tests that require a local Docker daemon (testcontainers)"]
